name: smartbudget
description: "SmartBudget, suivi de budget personnel"
publish_to: 'none'
version: 1.2.0+10

environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # Base de données chiffrée (SQLCipher)
  sqflite_sqlcipher: ^3.1.0+1
  path_provider: ^2.1.5
  path: ^1.9.1

  # Chiffrement et trousseau
  flutter_secure_storage: ^9.2.4
  cryptography: ^2.7.0

  # État et navigation
  flutter_riverpod: ^2.6.1
  go_router: ^14.8.1

  # Empreinte
  local_auth: ^2.3.0

  # Dates et montants en français
  intl: ^0.20.2
  material_symbols_icons: ^4.2960.0
  workmanager: ^0.10.10
  flutter_local_notifications: ^22.3.1
  pointycastle: ^4.0.0
dev_dependencies:
  flutter_test:
    sdk: flutter
  # Comme pour BodyCount : SQLCipher et le Keystore n'existent que sur un
  # appareil, les tests qui les touchent tournent sur un émulateur.
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/logo.png
    - assets/logo_icone.png
    - assets/categories.json
    - assets/banques/

  # Figtree, embarquée : l'application ne va jamais sur le réseau, même
  # pas pour une police.
  fonts:
    - family: Figtree
      fonts:
        - asset: assets/fonts/Figtree-400.ttf
          weight: 400
        - asset: assets/fonts/Figtree-500.ttf
          weight: 500
        - asset: assets/fonts/Figtree-600.ttf
          weight: 600
        - asset: assets/fonts/Figtree-700.ttf
          weight: 700
        - asset: assets/fonts/Figtree-800.ttf
          weight: 800
