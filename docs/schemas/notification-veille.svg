<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 570" width="1280" height="570" role="img" aria-label="Une vérification, toutes les six heures, même application fermée. Android réveille la veille quand il y a du réseau ; la clé maîtresse est chargée sans empreinte ; Enable Banking donne le solde, rien d’autre ; le solde est comparé à zéro, en tenant compte d’une alerte déjà donnée ; une notification part seulement au passage sous zéro ; puis tout est refermé, la clé oubliée et la base fermée. La clé ne reste en mémoire que le temps de la lecture. Sans réseau ou accès expiré, rien ne s’affiche et Android réessaie au passage suivant. Chaque synchronisation dans l’application fait la même comparaison.">
<title>Une vérification, toutes les six heures, même application fermée. Android réveille la veille quand il y a du réseau ; la clé maîtresse est chargée sans empreinte ; Enable Banking donne le solde, rien d’autre ; le solde est comparé à zéro, en tenant compte d’une alerte déjà donnée ; une notification part seulement au passage sous zéro ; puis tout est refermé, la clé oubliée et la base fermée. La clé ne reste en mémoire que le temps de la lecture. Sans réseau ou accès expiré, rien ne s’affiche et Android réessaie au passage suivant. Chaque synchronisation dans l’application fait la même comparaison.</title>
