<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 440" width="1280" height="440" role="img" aria-label="Relier la banque, en six étapes qui s’allument tour à tour : Smart Budget signe un JWT en RS256 ; Enable Banking ouvre une demande avec un état tiré au hasard ; tu valides au Crédit Mutuel de Bretagne par Safetrans ; la banque revient sur GitHub Pages ; la page rend la main à l’application par smartbudget://banque, qui vérifie l’état et ouvre la session ; la session dure 180 jours, douze mois sont importés, puis une synchronisation à chaque ouverture.">
<title>Relier la banque, en six étapes qui s’allument tour à tour : Smart Budget signe un JWT en RS256 ; Enable Banking ouvre une demande avec un état tiré au hasard ; tu valides au Crédit Mutuel de Bretagne par Safetrans ; la banque revient sur GitHub Pages ; la page rend la main à l’application par smartbudget://banque, qui vérifie l’état et ouvre la session ; la session dure 180 jours, douze mois sont importés, puis une synchronisation à chaque ouverture.</title>
