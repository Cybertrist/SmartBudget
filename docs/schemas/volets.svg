<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 462" width="1280" height="462" role="img" aria-label="L’écran déplié. Une tablette avec son rail à gauche montre deux volets côte à côte. Toucher Logement dans la liste des dépenses pousse tout vers la gauche et ouvre Logement à droite ; puis Loyer ; puis l’opération Foncia Loyer. La ligne ouverte reste surlignée dans le volet de gauche. Un geste retour depuis le bord droit referme les volets un à un, jusqu’à l’analyse. À droite, la pile des pages ouvertes s’allonge puis se vide.">
<title>L’écran déplié. Une tablette avec son rail à gauche montre deux volets côte à côte. Toucher Logement dans la liste des dépenses pousse tout vers la gauche et ouvre Logement à droite ; puis Loyer ; puis l’opération Foncia Loyer. La ligne ouverte reste surlignée dans le volet de gauche. Un geste retour depuis le bord droit referme les volets un à un, jusqu’à l’analyse. À droite, la pile des pages ouvertes s’allonge puis se vide.</title>
