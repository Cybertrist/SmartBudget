<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 480" width="1280" height="480" role="img" aria-label="The balance watch. Every six hours, even with the app closed, the current account balance is read again. Over two days, eight reads: 320, 180 and 60 euros, then -42.10 euros at midnight, and the locked phone gets the notification Current account overdrawn, Your current account is at -42.10 euros. At the next two reads, -85 and -20 euros, no new alert: already told. At 150 euros, the alert re-arms. Four reads a day at most, the PSD2 limit for access made without the user.">
<title>The balance watch. Every six hours, even with the app closed, the current account balance is read again. Over two days, eight reads: 320, 180 and 60 euros, then -42.10 euros at midnight, and the locked phone gets the notification Current account overdrawn, Your current account is at -42.10 euros. At the next two reads, -85 and -20 euros, no new alert: already told. At 150 euros, the alert re-arms. Four reads a day at most, the PSD2 limit for access made without the user.</title>
