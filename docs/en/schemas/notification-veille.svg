<text x="60" y="52" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13" font-weight="700" fill="#1ED760" text-anchor="start" letter-spacing="3">ONE CHECK, EVERY SIX HOURS</text><text x="500" y="52" font-family="system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="14" font-weight="400" fill="#8B99A8" text-anchor="start" >Even with the app closed. A few seconds, then nothing left in memory.</text><path d="M230 161 L640 161 L1050 161 L1050 333 L640 333 L230 333" fill="none" stroke="#2F3A47" stroke-width="2" stroke-dasharray="6 7">
