<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 570" width="1280" height="570" role="img" aria-label="One check, every six hours, even with the app closed. Android wakes the watch when there is a network; the master key is loaded without fingerprint; Enable Banking gives the balance, nothing else; the balance is compared to zero, taking an alert already given into account; a notification goes out only when dropping below zero; then everything is closed, the key forgotten and the database closed. The key stays in memory only for the read. Without a network or with expired access, nothing shows and Android tries again next time. Every sync inside the app runs the same comparison.">
<title>One check, every six hours, even with the app closed. Android wakes the watch when there is a network; the master key is loaded without fingerprint; Enable Banking gives the balance, nothing else; the balance is compared to zero, taking an alert already given into account; a notification goes out only when dropping below zero; then everything is closed, the key forgotten and the database closed. The key stays in memory only for the read. Without a network or with expired access, nothing shows and Android tries again next time. Every sync inside the app runs the same comparison.</title>
