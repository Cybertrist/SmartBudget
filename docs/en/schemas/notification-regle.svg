<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 560" width="1280" height="560" role="img" aria-label="The alert rule: two states, armed and warned. Six balance reads: 120 euros and 35 euros, nothing to say; -42 euros, the account drops below zero, a Current account overdrawn notification, and the state becomes warned; -80 euros, silence, already warned; 15 euros, the account recovers, the alert is re-armed; -8 euros, a new notification. One alert per drop below zero.">
<title>The alert rule: two states, armed and warned. Six balance reads: 120 euros and 35 euros, nothing to say; -42 euros, the account drops below zero, a Current account overdrawn notification, and the state becomes warned; -80 euros, silence, already warned; 15 euros, the account recovers, the alert is re-armed; -8 euros, a new notification. One alert per drop below zero.</title>
