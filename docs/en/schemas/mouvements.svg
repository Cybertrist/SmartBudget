<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 440" width="1280" height="440" role="img" aria-label="Three traps in a statement, and how the app gets out of them. A transfer to the Livret A savings account, read in VIR VERS LIVRET A DE COMPTE COURANT: the money moves from the current account to savings, it is outside the budget, counted as 200 euros put aside, and the budget is unchanged. A 500 euro cheque that refunds: 300 euros go to the 380 euro train ticket, leaving 80, and 200 to the 260 euro restaurant, leaving 60; the cheque does not count as income. Cash: a 50 euro withdrawal, then 12 euros at the market; withdrawals drop to 38, groceries rise to 12, the wallet goes from 50 to 38 euros, and the month’s spending stays at 50 euros, not 62.">
<title>Three traps in a statement, and how the app gets out of them. A transfer to the Livret A savings account, read in VIR VERS LIVRET A DE COMPTE COURANT: the money moves from the current account to savings, it is outside the budget, counted as 200 euros put aside, and the budget is unchanged. A 500 euro cheque that refunds: 300 euros go to the 380 euro train ticket, leaving 80, and 200 to the 260 euro restaurant, leaving 60; the cheque does not count as income. Cash: a 50 euro withdrawal, then 12 euros at the market; withdrawals drop to 38, groceries rise to 12, the wallet goes from 50 to 38 euros, and the month’s spending stays at 50 euros, not 62.</title>
<defs>
  <filter id="halo" x="-50%" y="-50%" width="200%" height="200%">
    <feGaussianBlur stdDeviation="6" result="b"/>
    <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <pattern id="grille" width="40" height="40" patternUnits="userSpaceOnUse">
