<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 530" width="1280" height="530" role="img" aria-label="Encryption. The fingerprint loads the 32-byte master key from the Android Keystore. HKDF-SHA256 derives two keys from it: one opens the SQLCipher database, the other encrypts the Enable Banking private key with AES-GCM. Separately, the backup: a passphrase chosen at export goes through 210,000 rounds of PBKDF2 and encrypts, with AES-GCM, a .sbx file readable on another phone. Without the fingerprint, the key is not in memory, and getting around the unlock screen gives access to nothing.">
<title>Encryption. The fingerprint loads the 32-byte master key from the Android Keystore. HKDF-SHA256 derives two keys from it: one opens the SQLCipher database, the other encrypts the Enable Banking private key with AES-GCM. Separately, the backup: a passphrase chosen at export goes through 210,000 rounds of PBKDF2 and encrypts, with AES-GCM, a .sbx file readable on another phone. Without the fingerprint, the key is not in memory, and getting around the unlock screen gives access to nothing.</title>
